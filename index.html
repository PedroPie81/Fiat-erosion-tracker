    <script>
      // Global error handlers to silence cross-origin and "Script error" issues occurring in sandbox iframe environments
      window.onerror = function(message, source, lineno, colno, error) {
        const msg = String(message || '');
        const src = String(source || '');
        
        // Match any "Script error.", "script error", or external script origins
        if (msg.toLowerCase().indexOf('script error') !== -1 || 
            msg.indexOf('adsbygoogle') !== -1 || 
            msg.indexOf('gtag') !== -1 || 
            !src || 
            src.indexOf('pagead') !== -1 || 
            src.indexOf('googlesyndication') !== -1 ||
            src.indexOf('googletagmanager') !== -1 ||
            (src && src.indexOf(window.location.host) === -1 && src.indexOf('http') === 0)) {
          console.warn('Swallowed cross-origin or external script error:', message, 'from', source);
          return true; // Prevents the firing of the default event handler
        }
        return false;
      };

      window.addEventListener('error', function(e) {
        const message = String(e.message || '');
        const source = String(e.filename || '');
        
        if (message.toLowerCase().indexOf('script error') !== -1 || 
            message.indexOf('adsbygoogle') !== -1 || 
            message.indexOf('gtag') !== -1 || 
            !source ||
            source.indexOf('pagead') !== -1 || 
            source.indexOf('googlesyndication') !== -1 ||
            source.indexOf('googletagmanager') !== -1 ||
            (source && source.indexOf(window.location.host) === -1 && source.indexOf('http') === 0)) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        const reason = e.reason && e.reason.message ? String(e.reason.message) : '';
        if (reason.toLowerCase().indexOf('script error') !== -1 || 
            reason.indexOf('adsbygoogle') !== -1 || 
            reason.indexOf('gtag') !== -1 ||
            reason.indexOf('googletagmanager') !== -1) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      });
    </script>
